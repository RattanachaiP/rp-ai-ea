name: PR155 Promotion Decision

on:
  pull_request:
    branches: [codex-dev]
    paths:
      - 'learning/promotion_decision/**'
      - 'learning/qualification/**'
      - 'tests/learning/test_promotion_decision.py'
      - 'tests/learning/test_knowledge_qualification.py'
      - '.github/workflows/pr155-promotion-decision.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Promotion decision regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile promotion decision package
        run: python -m compileall -q learning/promotion_decision
      - name: Run promotion and qualification regressions
        run: python -m pytest -q tests/learning/test_promotion_decision.py tests/learning/test_knowledge_qualification.py

  authority-boundary:
    name: Promotion advisory authority boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce advisory-only dependency boundary
        shell: python
        run: |
          import ast
          from pathlib import Path

          tree = ast.parse(Path('learning/promotion_decision/engine.py').read_text(encoding='utf-8'))
          forbidden_roots = {
              'learning.control_plane', 'learning.governance', 'learning.lifecycle',
              'learning.analytics', 'learning.policy', 'learning.knowledge',
              'learning.executor', 'learning.broker', 'learning.mt5',
          }
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          found = sorted(name for name in imports if any(name == root or name.startswith(root + '.') for root in forbidden_roots))
          if found:
              raise SystemExit(f'Forbidden advisory dependency: {found}')

          from learning.promotion_decision.engine import PromotionDecisionEngine
          forbidden_methods = {'save', 'append', 'transition', 'promote', 'retire', 'execute', 'write', 'delete'}
          exposed = forbidden_methods & set(dir(PromotionDecisionEngine))
          if exposed:
              raise SystemExit(f'Mutating advisory API exposed: {sorted(exposed)}')

  artifact-binding:
    name: Promotion artifact binding and fail-closed validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify integrity, lineage binding, and precedence
        run: python -m pytest -q tests/learning/test_promotion_decision.py -k 'tampered or bound or forged or conflict or precedes or duplicate or locks'

  persistence:
    name: Promotion decision append-only persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify deterministic replay and immutability
        run: python -m pytest -q tests/learning/test_promotion_decision.py -k 'deterministic or immutable'