name: PR153 Knowledge Control Plane

on:
  pull_request:
    branches: [codex-dev]
    paths:
      - 'learning/control_plane/**'
      - 'tests/learning/test_knowledge_control_plane.py'
      - '.github/workflows/pr153-knowledge-control-plane.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Control-plane regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile control plane
        run: python -m compileall -q learning/control_plane
      - name: Run control-plane and upstream learning regressions
        run: python -m pytest -q tests/learning/test_knowledge_control_plane.py tests/learning

  authority-boundary:
    name: Control-plane authority boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce read-only boundary
        shell: python
        run: |
          from pathlib import Path
          source = '\n'.join(path.read_text(encoding='utf-8') for path in Path('learning/control_plane').glob('*.py')).lower()
          forbidden_imports = ('decision_engine', 'executor', 'broker', 'mt5', 'order_send')
          found = [term for term in forbidden_imports if term in source]
          if found:
              raise SystemExit(f'Forbidden runtime dependency: {found}')
          from learning.control_plane import KnowledgeControlPlane
          forbidden_methods = {'save', 'append', 'transition', 'promote', 'retire', 'execute', 'write', 'delete'}
          exposed = forbidden_methods & set(dir(KnowledgeControlPlane))
          if exposed:
              raise SystemExit(f'Mutating API exposed: {sorted(exposed)}')
