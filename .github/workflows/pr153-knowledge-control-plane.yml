name: PR153 Knowledge Control Plane

on:
  pull_request:
    branches: [codex-dev]
    paths:
      - 'learning/control_plane/**'
      - 'tests/learning/test_knowledge_control_plane.py'
      - '.github/workflows/pr153-knowledge-control-plane.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Control-plane regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile control plane
        run: python -m compileall -q learning/control_plane
      - name: Run control-plane and upstream learning regressions
        run: python -m pytest -q tests/learning/test_knowledge_control_plane.py tests/learning

  authority-boundary:
    name: Control-plane authority boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce read-only boundary
        shell: python
        run: |
          import ast
          from pathlib import Path

          forbidden_modules = {'decision_engine', 'executor', 'broker', 'mt5', 'order_send'}
          forbidden_methods = {'save', 'append', 'transition', 'promote', 'retire', 'execute', 'write', 'delete'}

          for path in Path('learning/control_plane').glob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      imported = [node.module or '']
                  else:
                      imported = []
                  for name in imported:
                      found = forbidden_modules & set(name.lower().split('.'))
                      if found:
                          raise SystemExit(f'Forbidden runtime dependency in {path}: {sorted(found)}')

              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == 'KnowledgeControlPlane':
                      exposed = forbidden_methods & {
                          item.name for item in node.body if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                      }
                      if exposed:
                          raise SystemExit(f'Mutating API exposed: {sorted(exposed)}')
