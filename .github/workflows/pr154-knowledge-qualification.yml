name: PR154 Knowledge Qualification

on:
  pull_request:
    branches: [codex-dev]
    paths:
      - 'learning/qualification/**'
      - 'tests/learning/test_knowledge_qualification.py'
      - '.github/workflows/pr154-knowledge-qualification.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Qualification regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile qualification package
        run: python -m compileall -q learning/qualification
      - name: Run qualification and upstream learning regressions
        run: python -m pytest -q tests/learning/test_knowledge_qualification.py tests/learning

  authority-boundary:
    name: Qualification authority boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce snapshot-only evaluator boundary
        shell: python
        run: |
          import ast
          from pathlib import Path

          engine_path = Path('learning/qualification/engine.py')
          tree = ast.parse(engine_path.read_text(encoding='utf-8'))
          forbidden_roots = {
              'learning.decision_engine', 'learning.executor', 'learning.broker',
              'learning.mt5', 'learning.knowledge', 'learning.governance',
              'learning.lifecycle', 'learning.analytics', 'learning.policy',
          }
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          found = sorted(name for name in imports if any(name == root or name.startswith(root + '.') for root in forbidden_roots))
          if found:
              raise SystemExit(f'Forbidden evaluator dependency: {found}')

          from learning.qualification import KnowledgeQualificationEngine
          forbidden_methods = {'save', 'append', 'transition', 'promote', 'retire', 'execute', 'write', 'delete'}
          exposed = forbidden_methods & set(dir(KnowledgeQualificationEngine))
          if exposed:
              raise SystemExit(f'Mutating evaluator API exposed: {sorted(exposed)}')

  persistence:
    name: Qualification append-only persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify deterministic replay and immutability
        run: python -m pytest -q tests/learning/test_knowledge_qualification.py -k 'immutable or deterministic'
