name: PR156 Promotion Authority

on:
  pull_request:
    branches: [codex-dev]
    paths:
      - 'learning/promotion_authority/**'
      - 'learning/promotion_decision/**'
      - 'learning/lifecycle/**'
      - 'tests/learning/test_promotion_authority.py'
      - 'tests/learning/test_promotion_decision.py'
      - 'tests/learning/test_knowledge_lifecycle.py'
      - '.github/workflows/pr156-promotion-authority.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Promotion authority regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m compileall -q learning/promotion_authority learning/promotion_decision
      - run: python -m pytest -q tests/learning/test_promotion_authority.py tests/learning/test_promotion_decision.py tests/learning/test_knowledge_lifecycle.py

  authority-boundary:
    name: Execution-only dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce injected lifecycle port and forbidden dependencies
        shell: python
        run: |
          import ast
          from pathlib import Path
          source = Path('learning/promotion_authority/authority.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden = {'learning.analytics', 'learning.qualification', 'learning.governance', 'learning.control_plane', 'learning.policy', 'learning.promotion_decision', 'learning.lifecycle', 'runtime', 'bridge'}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
              elif isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
          found = sorted(module for module in imports if any(module == root or module.startswith(root + '.') for root in forbidden))
          if found:
              raise SystemExit(f'Forbidden authority dependency: {found}')
          if 'def rollback(' in source:
              raise SystemExit('Public rollback authority must not be exposed')

  journal-safety:
    name: Append-only journal and crash-window safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/learning/test_promotion_authority.py -k 'append_only or in_doubt or idempotency or stale or semantic'
