name: PR152 Knowledge Policy

on:
  pull_request:
    branches: [codex-dev]
    paths:
      - "learning/policy/**"
      - "tests/learning/test_knowledge_policy.py"
      - ".github/workflows/pr152-knowledge-policy.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Policy regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile policy package
        run: python -m compileall -q learning/policy
      - name: Run policy and upstream regressions
        run: python -m pytest -q tests/learning/test_knowledge_policy.py tests/learning/test_knowledge_governance.py tests/learning/test_knowledge_lifecycle.py

  authority-boundary:
    name: Policy authority boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce passive policy boundary
        shell: python
        run: |
          from pathlib import Path
          source = "\n".join(path.read_text(encoding="utf-8") for path in Path("learning/policy").glob("*.py"))
          forbidden = ("decision_engine", "ordersend", "broker", "executor", "position_management")
          found = [value for value in forbidden if value in source.lower()]
          if found:
              raise SystemExit(f"Forbidden authority dependency: {found}")
